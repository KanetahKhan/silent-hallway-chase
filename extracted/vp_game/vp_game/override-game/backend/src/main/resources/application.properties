# ===== Override Backend =====

spring.application.name=override-backend
server.port=8080

# ----- H2 (development) -----
spring.datasource.url=jdbc:h2:file:./data/override-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# ----- MySQL (uncomment for production) -----
# Values are read from environment variables (see .env.example / setup.md).
# spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/override_db?useSSL=false&serverTimezone=UTC}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=${MYSQL_USER:root}
# spring.datasource.password=${MYSQL_PASSWORD:}

# ----- JPA -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ----- JWT -----
# Override these via environment variables in any shared/production deployment.
# The defaults below are for LOCAL DEVELOPMENT ONLY (see .env.example / setup.md).
app.jwt.secret=${APP_JWT_SECRET:OverrideGameSecretKeyChangeThisInProductionMakeItAtLeast256Bits!!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
